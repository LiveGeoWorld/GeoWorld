<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Test Runner — Results</title>
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
<link rel="stylesheet" href="/static/style.css">
<link rel="stylesheet" href="/ui/i18n.css">
<script src="/ui/i18n.js" defer></script>
</head>
<body>

<div id="app">
  <div class="header">
    <h1>Route Planning — Test Results</h1>
    <span id="summary-bar"></span>
  </div>

  <div class="main">
    <div class="sidebar">
      <div id="run-selector-area" class="run-selector-area hidden"></div>
      <div class="bar"><span data-ui-text>结果列表</span><span id="result-count"></span></div>
      <div id="result-list"></div>
    </div>

    <div class="content">
      <div id="compare-map" class="hidden"></div>
      <div id="detail" class="detail"></div>
    </div>
  </div>
</div>

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script src="/static/polyline.js"></script>
<script src="/static/app.js"></script>
</body>
</html>
